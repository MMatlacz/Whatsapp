name: Native iOS CI

on:
  pull_request:
    branches:
      - apple
    paths:
      - "native-ios/**"
      - ".swiftlint.yml"
      - ".github/workflows/native-ios-ci.yml"
  push:
    branches:
      - apple
    paths:
      - "native-ios/**"
      - ".swiftlint.yml"
      - ".github/workflows/native-ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check WhatsApp bridge JavaScript syntax
        run: |
          set -euo pipefail
          node --check native-ios/WhatsAppTranslator/WhatsAppBridge.js

      - name: Run SwiftLint on Ubuntu
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ghcr.io/realm/swiftlint:0.65.1 \
            lint --strict --config .swiftlint.yml

  test-core:
    name: test-core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run host-independent Swift tests on Linux
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            swift:6.0-noble \
            bash -lc 'apt-get update >/dev/null && \
              apt-get install -y --no-install-recommends libsqlite3-dev >/dev/null && \
              swift test \
                --package-path native-ios \
                --configuration debug \
                --parallel'

  build-apple:
    name: build-apple
    runs-on: xcode-27
    needs:
      - lint
      - test-core
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Inspect project
        run: |
          set -euo pipefail
          xcodebuild \
            -project native-ios/WhatsAppTranslator.xcodeproj \
            -list

      - name: Build native iOS target for Simulator SDK
        run: |
          set -euo pipefail
          xcodebuild \
            -project native-ios/WhatsAppTranslator.xcodeproj \
            -target WhatsAppTranslator \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Install Metal toolchain for diagnostic MLX adapter
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version

      - name: Resolve diagnostic MLX package
        working-directory: native-ios/QwenMLXDiagnosticAdapter
        run: |
          set -euo pipefail
          swift package resolve
          test -f Package.resolved
          cat Package.resolved

      - name: Upload resolved diagnostic graph
        uses: actions/upload-artifact@v4
        with:
          name: qwen-mlx-package-resolved
          path: native-ios/QwenMLXDiagnosticAdapter/Package.resolved
          if-no-files-found: error
          retention-days: 1

      - name: Build and test diagnostic MLX adapter on macOS
        working-directory: native-ios/QwenMLXDiagnosticAdapter
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme QwenMLXDiagnosticAdapter \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$PWD/.xcodebuild" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build test
          swift build --product qwen-mlx-benchmark
          swift run qwen-mlx-benchmark --help

      - name: Build diagnostic MLX adapter for iOS Simulator
        working-directory: native-ios/QwenMLXDiagnosticAdapter
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme QwenMLXDiagnosticAdapter \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/.xcodebuild-ios" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Record validation boundaries
        run: |
          cat <<'EOF'
          Ubuntu CI validates Swift style, WhatsAppBridge.js syntax, and all current
          host-independent deterministic Swift tests, including bridge/session contracts,
          WhatsAppWebTransport request/response/event orchestration, translation/context logic,
          and the SQLite domain persistence layer. The Xcode runner compiles the Apple-specific
          WebKit runtime, SQLite persistence source, and application against the iOS Simulator SDK.

          P0.2b additionally resolves the isolated QwenMLXDiagnosticAdapter dependency graph,
          compiles/tests that diagnostic package on macOS, and compiles it for the iOS Simulator.
          Its artifact verifier and injected-generator tests use synthetic local files only.
          P0.2c additionally builds the shared benchmark executable, checks its no-model --help
          path, and runs deterministic tests for fixture identity, outcome classification,
          timeout behavior, and result export. CI does not download Qwen model weights and does
          not run MLX inference.

          Neither these package builds nor the Simulator build validate Qwen translation quality,
          physical-iPhone latency/memory/thermal behavior, Foundation Models inference,
          real WhatsApp Web authentication, linked-device persistence, force-quit restoration,
          offline resync, or a real group message arriving through WebKit on a physical iPhone.
          Those acceptance gates remain open in their dedicated roadmap issues.
          EOF
