name: Native iOS CI

on:
  pull_request:
    branches:
      - apple
    paths:
      - "native-ios/**"
      - ".github/workflows/native-ios-ci.yml"
  push:
    branches:
      - apple
    paths:
      - "native-ios/**"
      - ".github/workflows/native-ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Inspect project
        run: |
          set -euo pipefail
          xcodebuild \
            -project native-ios/WhatsAppTranslator.xcodeproj \
            -list

      - name: Build native iOS target for Simulator SDK
        run: |
          set -euo pipefail
          xcodebuild \
            -project native-ios/WhatsAppTranslator.xcodeproj \
            -target WhatsAppTranslator \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run deterministic bridge XCTest suite
        run: |
          set -euo pipefail
          swift test \
            --package-path native-ios \
            --configuration debug

      - name: Record hardware-only validation boundary
        run: |
          cat <<'EOF'
          Native iOS CI validates the iOS app build against Xcode 27 and runs deterministic XCTest coverage
          for the exact WhatsAppBridgeSupport.swift source compiled into the app. The bridge tests are host-independent
          and use no WhatsApp credentials, session material, or network-dependent acceptance flow.

          CI still does not validate Foundation Models inference, Apple Intelligence availability, WhatsApp Web
          authentication, linked-device persistence, force-quit restoration, or offline resync on a physical iPhone.
          Those acceptance gates remain open in their dedicated roadmap issues.
          EOF
