name: Native iOS CI

on:
  pull_request:
    branches:
      - apple
    paths:
      - "native-ios/**"
      - ".swiftlint.yml"
      - ".github/workflows/native-ios-ci.yml"
  push:
    branches:
      - apple
    paths:
      - "native-ios/**"
      - ".swiftlint.yml"
      - ".github/workflows/native-ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run SwiftLint on Ubuntu
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ghcr.io/realm/swiftlint:0.65.1 \
            lint --strict --config .swiftlint.yml

  test-core:
    name: test-core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run host-independent Swift tests on Linux
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            swift:6.0-noble \
            swift test \
              --package-path native-ios \
              --configuration debug \
              --parallel

  build-apple:
    name: build-apple
    runs-on: xcode-27
    needs:
      - lint
      - test-core
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Inspect project
        run: |
          set -euo pipefail
          xcodebuild \
            -project native-ios/WhatsAppTranslator.xcodeproj \
            -list

      - name: Build native iOS target for Simulator SDK
        run: |
          set -euo pipefail
          xcodebuild \
            -project native-ios/WhatsAppTranslator.xcodeproj \
            -target WhatsAppTranslator \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Record validation boundaries
        run: |
          cat <<'EOF'
          Ubuntu CI validates Swift style and all current host-independent deterministic Swift tests,
          including WhatsApp bridge parsing/session-contract tests and translation/context logic.
          The Xcode runner is reserved for compiling the Apple-specific application against the
          iOS Simulator SDK.

          Neither Linux tests nor the Simulator build validate Foundation Models inference,
          Apple Intelligence availability, real WhatsApp Web authentication, linked-device
          persistence, force-quit restoration, offline resync, or other physical-iPhone behavior.
          Those acceptance gates remain open in their dedicated roadmap issues.
          EOF
