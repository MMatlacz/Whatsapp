name: Reapply PR183 semantic renderer

on:
  push:
    branches:
      - codex/148-render-semantic-content-v2

permissions:
  contents: write

jobs:
  reapply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: codex/148-render-semantic-content-v2
          fetch-depth: 0

      - name: Reapply semantic rendering onto current apple
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          package_path = Path("native-ios/Package.swift")
          package = package_path.read_text()

          for target in ["WhatsAppDomainCore", "TranslationCore", "PersistenceCore"]:
              start = package.index(f'name: "{target}"')
              end = package.index("        ),", start)
              block = package[start:end]
              marker = '                "WhatsAppRootView.swift",\n'
              assert block.count(marker) == 1, (target, block.count(marker))
              block = block.replace(
                  marker,
                  marker + '                "WhatsAppSemanticMessagePresentation.swift",\n',
                  1,
              )
              package = package[:start] + block + package[end:]

          start = package.index('name: "WhatsAppBridgeCore"')
          end = package.index("        ),", start)
          block = package[start:end]
          old = (
              '                "WhatsAppTransportDomainMapper.swift",\n'
              '                "WhatsAppWebTransportCore.swift",\n'
          )
          new = (
              '                "WhatsAppTransportDomainMapper.swift",\n'
              '                "WhatsAppSemanticMessagePresentation.swift",\n'
              '                "WhatsAppWebTransportCore.swift",\n'
          )
          assert block.count(old) == 1, block.count(old)
          block = block.replace(old, new, 1)
          package = package[:start] + block + package[end:]
          package_path.write_text(package)

          root_path = Path("native-ios/WhatsAppTranslator/WhatsAppRootView.swift")
          root = root_path.read_text()
          old_media = '''                if let media = message.media {
                    NativeMediaAttachmentView(media: media, previewKey: mediaPreviewKey, preview: mediaPreview)
                } else if message.body == nil, message.linkPreview == nil {
                    Text("Message content is unavailable")
                }
'''
          new_media = '''                if let media = message.media {
                    NativeMediaAttachmentView(media: media, previewKey: mediaPreviewKey, preview: mediaPreview)
                }
                if let semanticPresentation {
                    NativeSemanticMessageContentView(presentation: semanticPresentation)
                } else if message.body == nil, message.linkPreview == nil, message.media == nil {
                    Text("Message content is unavailable")
                }
'''
          assert root.count(old_media) == 1, root.count(old_media)
          root = root.replace(old_media, new_media, 1)

          old_end = '''        .frame(maxWidth: .infinity, alignment: message.fromMe ? .trailing : .leading)
        .accessibilityElement(children: .contain)
    }
}

private struct NativeLinkPreviewCard: View {
'''
          new_end = '''        .frame(maxWidth: .infinity, alignment: message.fromMe ? .trailing : .leading)
        .accessibilityElement(children: .contain)
    }

    private var semanticPresentation: WhatsAppSemanticMessagePresentation? {
        WhatsAppSemanticMessagePresenter.presentation(for: message.content)
    }
}

private struct NativeSemanticMessageContentView: View {
    let presentation: WhatsAppSemanticMessagePresentation

    var body: some View {
        VStack(alignment: .leading, spacing: 5) {
            Label(presentation.title, systemImage: presentation.systemImage)
                .font(.subheadline.weight(.medium))
            if let detail = presentation.detail {
                Text(detail).font(.caption).foregroundStyle(.secondary)
            }
            ForEach(Array(presentation.items.enumerated()), id: \.offset) { index, item in
                HStack(alignment: .firstTextBaseline, spacing: 6) {
                    Text("\(index + 1).")
                        .font(.caption2).foregroundStyle(.secondary)
                    Text(item).font(.caption)
                }
            }
        }
        .frame(maxWidth: .infinity, alignment: .leading)
        .accessibilityElement(children: .ignore)
        .accessibilityLabel(presentation.accessibilityLabel)
    }
}

