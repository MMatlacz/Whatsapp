name: Secret checks

on:
  pull_request:
    branches:
      - apple
  push:
    branches:
      - apple
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  forbidden-sensitive-files:
    name: forbidden-sensitive-files
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Reject sensitive file paths in reachable history
        shell: bash
        run: |
          set -euo pipefail

          pattern='(^|/)\.pi(/|$)|(^|/)\.env($|\.)|(^|/)(auth\.json|provider-keys\.json|credentials\.json)$|\.(pem|p12|pfx|key)$'
          matches="$(git log --all --name-only --format= | sed '/^$/d' | sort -u | grep -Ei "$pattern" || true)"

          if [[ -n "$matches" ]]; then
            echo "Forbidden sensitive file path(s) found in reachable Git history:"
            printf '%s\n' "$matches"
            echo "Remove the file(s) and purge them from reachable history before merging."
            exit 1
          fi

          echo "No forbidden sensitive file paths found."
