title = "WhatsApp Translator gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

# Rule scope avoids global path prefiltering and works with CI's Gitleaks 8.24.3.
[[rules.allowlists]]
condition = "AND"
description = "Public Hugging Face snapshot revisions in P0.2d3 bake-off evidence"
regexTarget = "secret"
paths = [
  '''^docs/native/p0\.2d3-bakeoff/.*$''',
]
regexes = [
  '''^15fed4eafb456c6fcb2a1165f19ac609670ed14b$''',
  '''^5d894f8cc4ef3e6c88537bf3746ed262f549da6a$''',
  '''^ff1143e3a10547c9f2129e94ca37059b096b23f4$''',
]

[[rules.allowlists]]
description = "Public Qwen snapshot revision in the derived context corpus"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^docs/native/p0\.2d4-reference-controls/context-corpus\.json$''',
]
regexes = [
  '''^5d894f8cc4ef3e6c88537bf3746ed262f549da6a$''',
]
